<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV AI Enhancer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 500px; }
        input[type="file"] { display: none; }
        .btn { display: inline-block; padding: 10px 20px; margin: 15px 0; background-color: #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease-in-out; }
        .btn:hover { background-color: #d0d0d0; transform: translateY(-2px); }
        .primary-btn { background-color: #007bff; color: white; border: none; width: 100%; font-size: 1rem; }
        .primary-btn:disabled { background-color: #a0c4ff; cursor: not-allowed; }
        .preview-area { margin: 20px 0; border: 2px dashed #ccc; border-radius: 8px; min-height: 200px; display: flex; justify-content: center; align-items: center; background-color: #fafafa; }
        canvas { max-width: 100%; display: none; border-radius: 4px; }
        
        /* Progress Bar UI */
        .progress-container { display: none; margin: 15px 0; text-align: left; }
        .progress-track { width: 100%; background-color: #e0e0e0; border-radius: 8px; height: 10px; overflow: hidden; margin-bottom: 5px; }
        .progress-fill { height: 100%; background-color: #007bff; width: 0%; transition: width 0.1s linear; }
        .progress-text { font-size: 0.85rem; color: #555; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <h1>NAV AI Enhancer</h1>
        <p>100% Local AI Processing</p>
        
        <input type="file" id="imageUpload" accept="image/*">
        <label for="imageUpload" class="btn">Select Image</label>
        
        <div class="preview-area">
            <span id="placeholderText">No image selected</span>
            <canvas id="imageCanvas"></canvas>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-track"><div class="progress-fill" id="progressBarFill"></div></div>
            <span class="progress-text" id="progressText">Connecting to Server...</span>
        </div>
        
        <button id="processBtn" class="btn primary-btn" disabled>Sharpen Boundaries</button>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const imageCanvas = document.getElementById('imageCanvas');
        const ctx = imageCanvas.getContext('2d');
        const processBtn = document.getElementById('processBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressText = document.getElementById('progressText');

        // Handle Image Upload
        imageUpload.addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    imageCanvas.width = img.width;
                    imageCanvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    imageCanvas.style.display = 'block';
                    document.getElementById('placeholderText').style.display = 'none';
                    processBtn.disabled = false;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // Preprocess: Scale to exactly 320x320 and format to Planar RGB
        function preprocessImageTo320x320Tensor(sourceCanvas) {
            const size = 320;
            
            // Create an invisible temporary canvas for resizing
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            const tempCtx = tempCanvas.getContext('2d');
            
            // Force the original image to squash into 320x320
            tempCtx.drawImage(sourceCanvas, 0, 0, size, size);
            const imageData = tempCtx.getImageData(0, 0, size, size);
            const { data } = imageData;
            
            const float32Data = new Float32Array(3 * size * size);
            
            for (let i = 0; i < size * size; i++) {
                float32Data[i] = data[i * 4] / 255.0;                   // Red
                float32Data[size * size + i] = data[i * 4 + 1] / 255.0; // Green
                float32Data[size * size * 2 + i] = data[i * 4 + 2] / 255.0; // Blue
            }
            
            return new ort.Tensor('float32', float32Data, [1, 3, size, size]);
        }

        // Processing and Downloading Engine
        processBtn.addEventListener('click', async () => {
            processBtn.disabled = true;
            processBtn.innerText = "Initializing Engine...";
            
            try {
                const modelUrl = 'https://huggingface.co/frankminors123/U2Net_Portrait_ONNX/resolve/main/u2net_portrait.onnx';
                const cache = await caches.open('nav-ai-models-v1');
                let cachedResponse = await cache.match(modelUrl);
                let modelBuffer;

                if (!cachedResponse) {
                    processBtn.innerText = "Downloading Model (Once)...";
                    progressContainer.style.display = 'block'; // Unhide progress UI
                    
                    const response = await fetch(modelUrl);
                    if (!response.ok) throw new Error("Network response was not ok.");
                    
                    // Estimate size if server doesn't provide it (U2Net is ~178MB)
                    const contentLength = response.headers.get('content-length') || 178000000;
                    const total = parseInt(contentLength, 10);
                    let loaded = 0;
                    
                    const reader = response.body.getReader();
                    const chunks = [];
                    
                    // Live Streaming Download Track
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        loaded += value.length;
                        
                        const percent = Math.min(100, Math.round((loaded / total) * 100));
                        progressBarFill.style.width = percent + '%';
                        progressText.innerText = `Downloading... ${percent}% (${(loaded / 1024 / 1024).toFixed(1)} MB)`;
                    }
                    
                    progressText.innerText = "Saving model to device...";
                    const blob = new Blob(chunks);
                    modelBuffer = await blob.arrayBuffer();
                    await cache.put(modelUrl, new Response(modelBuffer));
                    progressContainer.style.display = 'none'; // Hide progress UI when done
                    
                } else {
                    processBtn.innerText = "Loading Local Model...";
                    modelBuffer = await cachedResponse.arrayBuffer();
                }

                // AI Inference Execution
                processBtn.innerText = "Processing Image...";
                const session = await ort.InferenceSession.create(modelBuffer, { executionProviders: ['wasm'] });
                
                // Format directly from the visible canvas to 320x320
                const tensor = preprocessImageTo320x320Tensor(imageCanvas);
                
                // Run the heavy math
                const results = await session.run({ [session.inputNames[0]]: tensor });
                
                console.log("Inference successful:", results);
                alert("AI Processing complete! Check console for raw arrays.");
                
            } catch (err) {
                console.error(err);
                alert("Error: " + err.message);
                progressContainer.style.display = 'none';
            } finally {
                processBtn.innerText = "Sharpen Boundaries";
                processBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
