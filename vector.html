<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV AI Enhancer & OCR</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Importing AI and OCR Engines -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 600px; }
        input[type="file"] { display: none; }
        .btn { display: inline-block; padding: 10px 20px; margin: 10px 5px; background-color: #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease-in-out; }
        .btn:hover { background-color: #d0d0d0; transform: translateY(-2px); }
        .primary-btn { background-color: #007bff; color: white; border: none; font-size: 1rem; width: 45%; }
        .primary-btn:disabled { background-color: #a0c4ff; cursor: not-allowed; }
        
        .button-group { display: flex; justify-content: space-between; margin-top: 15px; }
        
        .preview-area { margin: 20px 0; border: 2px dashed #ccc; border-radius: 8px; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #fafafa; gap: 10px; padding: 10px; }
        canvas { max-width: 100%; display: none; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* New Text Area Styling */
        textarea { width: 100%; min-height: 150px; margin-top: 15px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Poppins', sans-serif; font-size: 0.9rem; display: none; resize: vertical; }
        
        .progress-container { display: none; margin: 15px 0; text-align: left; }
        .progress-track { width: 100%; background-color: #e0e0e0; border-radius: 8px; height: 10px; overflow: hidden; margin-bottom: 5px; }
        .progress-fill { height: 100%; background-color: #007bff; width: 0%; transition: width 0.1s linear; }
        .progress-text { font-size: 0.85rem; color: #555; font-weight: 600; }
        .label-text { font-size: 0.8rem; color: #777; font-weight: bold; display: none; text-transform: uppercase; margin-top: 10px;}
    </style>
</head>
<body>

    <div class="container">
        <h1>NAV AI OCR</h1>
        <p>100% Local Processing</p>
        
        <input type="file" id="imageUpload" accept="image/*">
        <label for="imageUpload" class="btn">Select Image</label>
        
        <div class="preview-area">
            <span id="placeholderText">No image selected</span>
            
            <span class="label-text" id="originalLabel">Original Image</span>
            <canvas id="imageCanvas"></canvas>
            
            <span class="label-text" id="resultLabel">AI Boundary Mask</span>
            <canvas id="resultCanvas"></canvas>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-track"><div class="progress-fill" id="progressBarFill"></div></div>
            <span class="progress-text" id="progressText">Connecting...</span>
        </div>
        
        <!-- Editable Text Box -->
        <textarea id="outputTextArea" placeholder="Extracted text will appear here..."></textarea>
        
        <div class="button-group">
            <button id="processBtn" class="btn primary-btn" disabled>Trace Boundaries</button>
            <button id="ocrBtn" class="btn primary-btn" disabled>Extract Text</button>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const imageCanvas = document.getElementById('imageCanvas');
        const resultCanvas = document.getElementById('resultCanvas');
        const ctx = imageCanvas.getContext('2d');
        const resCtx = resultCanvas.getContext('2d');
        const processBtn = document.getElementById('processBtn');
        const ocrBtn = document.getElementById('ocrBtn');
        const outputTextArea = document.getElementById('outputTextArea');
        const progressContainer = document.getElementById('progressContainer');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressText = document.getElementById('progressText');
        const originalLabel = document.getElementById('originalLabel');
        const resultLabel = document.getElementById('resultLabel');

        // Handle Image Upload
        imageUpload.addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    imageCanvas.width = img.width;
                    imageCanvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    imageCanvas.style.display = 'block';
                    originalLabel.style.display = 'block';
                    resultCanvas.style.display = 'none';
                    resultLabel.style.display = 'none';
                    outputTextArea.style.display = 'none';
                    document.getElementById('placeholderText').style.display = 'none';
                    
                    processBtn.disabled = false;
                    ocrBtn.disabled = false;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // --- NEW OCR LOGIC ---
        ocrBtn.addEventListener('click', async () => {
            ocrBtn.disabled = true;
            processBtn.disabled = true;
            
            progressContainer.style.display = 'block';
            progressText.innerText = "Initializing Optical Character Recognition...";
            progressBarFill.style.width = '10%';
            
            outputTextArea.style.display = 'block';
            outputTextArea.value = "Scanning image for text... (This runs entirely on your device)";

            try {
                // Initialize Tesseract worker
                const worker = await Tesseract.createWorker('eng', 1, {
                    logger: m => {
                        // Hook into Tesseract's live progress to update the UI
                        if (m.status === 'recognizing text') {
                            const percent = Math.round(m.progress * 100);
                            progressBarFill.style.width = percent + '%';
                            progressText.innerText = `Extracting Text... ${percent}%`;
                        } else {
                            progressText.innerText = m.status;
                        }
                    }
                });

                // Extract text from the main canvas
                const ret = await worker.recognize(imageCanvas);
                
                // Print the final machine-encoded text into the text area
                outputTextArea.value = ret.data.text;
                
                await worker.terminate();
                progressText.innerText = "Text extraction complete!";
                setTimeout(() => progressContainer.style.display = 'none', 2000);

            } catch (error) {
                console.error(error);
                outputTextArea.value = "Error during text extraction: " + error.message;
                progressContainer.style.display = 'none';
            } finally {
                ocrBtn.disabled = false;
                processBtn.disabled = false;
            }
        });

        // Preprocess: Scale to exactly 320x320 and format to Planar RGB
        function preprocessImageTo320x320Tensor(sourceCanvas) {
            const size = 320;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCtx.drawImage(sourceCanvas, 0, 0, size, size);
            const imageData = tempCtx.getImageData(0, 0, size, size);
            const { data } = imageData;
            
            const float32Data = new Float32Array(3 * size * size);
            
            for (let i = 0; i < size * size; i++) {
                float32Data[i] = data[i * 4] / 255.0;                   
                float32Data[size * size + i] = data[i * 4 + 1] / 255.0; 
                float32Data[size * size * 2 + i] = data[i * 4 + 2] / 255.0; 
            }
            
            return new ort.Tensor('float32', float32Data, [1, 3, size, size]);
        }

        // Original U-Net Boundary Logic
        processBtn.addEventListener('click', async () => {
            processBtn.disabled = true;
            ocrBtn.disabled = true;
            
            try {
                const modelUrl = 'https://huggingface.co/frankminors123/U2Net_Portrait_ONNX/resolve/main/u2net_portrait.onnx';
                const cache = await caches.open('nav-ai-models-v1');
                let cachedResponse = await cache.match(modelUrl);
                let modelBuffer;

                if (!cachedResponse) {
                    progressContainer.style.display = 'block';
                    const response = await fetch(modelUrl);
                    if (!response.ok) throw new Error("Network response was not ok.");
                    
                    const contentLength = response.headers.get('content-length') || 178000000;
                    const total = parseInt(contentLength, 10);
                    let loaded = 0;
                    
                    const reader = response.body.getReader();
                    const chunks = [];
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        loaded += value.length;
                        
                        const percent = Math.min(100, Math.round((loaded / total) * 100));
                        progressBarFill.style.width = percent + '%';
                        progressText.innerText = `Downloading... ${percent}% (${(loaded / 1024 / 1024).toFixed(1)} MB)`;
                    }
                    
                    progressText.innerText = "Saving model to device...";
                    const blob = new Blob(chunks);
                    modelBuffer = await blob.arrayBuffer();
                    await cache.put(modelUrl, new Response(modelBuffer));
                    progressContainer.style.display = 'none'; 
                } else {
                    progressContainer.style.display = 'block';
                    progressText.innerText = "Loading Local Model...";
                    modelBuffer = await cachedResponse.arrayBuffer();
                }

                progressText.innerText = "Processing Image...";
                await new Promise(resolve => setTimeout(resolve, 100));

                const session = await ort.InferenceSession.create(modelBuffer, { 
                    executionProviders: ['webgl', 'wasm'] 
                });
                
                const tensor = preprocessImageTo320x320Tensor(imageCanvas);
                const results = await session.run({ [session.inputNames[0]]: tensor });
                
                const outputTensor = results[session.outputNames[0]];
                const maskData = outputTensor.data; 

                resultCanvas.width = 320;
                resultCanvas.height = 320;
                const outImageData = resCtx.createImageData(320, 320);
                
                for (let i = 0; i < 320 * 320; i++) {
                    const pixelValue = Math.min(255, Math.max(0, maskData[i] * 255)); 
                    const idx = i * 4; 
                    outImageData.data[idx] = pixelValue;     
                    outImageData.data[idx + 1] = pixelValue; 
                    outImageData.data[idx + 2] = pixelValue; 
                    outImageData.data[idx + 3] = 255;        
                }
                
                resCtx.putImageData(outImageData, 0, 0);
                resultCanvas.style.display = 'block';
                resultLabel.style.display = 'block';
                
                progressText.innerText = "Boundary trace complete!";
                setTimeout(() => progressContainer.style.display = 'none', 1500);

            } catch (err) {
                console.error(err);
                alert("Error: " + err.message);
                progressContainer.style.display = 'none';
            } finally {
                processBtn.disabled = false;
                ocrBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
